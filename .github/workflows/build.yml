name: Build, test, and package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore MediaFileRenamer.sln

      - name: Build and run tests
        run: dotnet test MediaFileRenamer.sln --configuration Release --no-restore

  package:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Determine build version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $version = "0.0.0-ci.$env:GITHUB_RUN_NUMBER"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore Windows application
        run: dotnet restore src/MediaFileRenamer.App/MediaFileRenamer.App.csproj --runtime win-x64

      - name: Publish self-contained Windows application
        run: >-
          dotnet publish src/MediaFileRenamer.App/MediaFileRenamer.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output publish
          -p:Version=${{ steps.version.outputs.version }}

      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath MediaFileRenamer-win-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash MediaFileRenamer-win-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  MediaFileRenamer-win-x64.zip" | Set-Content MediaFileRenamer-win-x64.zip.sha256 -NoNewline

      - name: Upload downloadable build
        uses: actions/upload-artifact@v7
        with:
          name: MediaFileRenamer-${{ github.ref_name }}-win-x64
          path: |
            MediaFileRenamer-win-x64.zip
            MediaFileRenamer-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged application
        uses: actions/download-artifact@v8
        with:
          name: MediaFileRenamer-${{ github.ref_name }}-win-x64
          path: release

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          release/MediaFileRenamer-win-x64.zip
          release/MediaFileRenamer-win-x64.zip.sha256
          --repo $env:GITHUB_REPOSITORY
          --title "Media File Renamer $env:GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
