version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "15:00"
      timezone: America/Chicago
    groups:
      dotnet-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "15:15"
      timezone: America/Chicago
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
